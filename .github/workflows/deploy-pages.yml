# 构建 flightsim 并部署到 GitHub Pages（站点根）
# 启用：仓库 Settings → Pages → Source 选择 "GitHub Actions"
name: Deploy flightsim to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['flightsim/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flightsim/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: flightsim
      - name: Type check & build
        run: npm run build
        working-directory: flightsim
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flightsim/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
